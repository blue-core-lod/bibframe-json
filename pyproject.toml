[project]
name = "bibframe-json"
version = "0.1.0"
description = "Read and validate one opinionated JSON expression of a BIBFRAME resource"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jsonschema>=4.23",
    # cbd.json references dialect.json rather than inlining it, so resolving
    # between the shipped schemas is part of reading them
    "referencing",
]

[dependency-groups]
dev = [
    # rdflib is the generator's dependency, not the library's: the ontology is
    # read at build time and nothing parses RDF at runtime.
    # a hard dependency of jsonschema, imported directly by the split-schema
    # test to resolve $refs between files
    # only to reframe corpus/ into the shape Blue Core stores. Nothing in the
    # package imports it, and nothing needs to: it is the authority on what
    # that shape is, so producing a sample of it should go through the same
    # code the database does rather than reimplement the framing here.
    "bluecore-models>=0.31.0",
    # to frame a CBD; arrives with bluecore-models, imported directly here
    "pyld",
    "rdflib>=7.1.3",
    "pytest>=8.3.4",
    "ruff>=0.9.6",
    "ty>=0.0.1a1",
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
# so that tests/test_example.py can import example/produce.py, the published
# recipe for producing this shape. example/ and generate/ are not part of the
# package -- hatchling ships only bibframe_json -- so they are reached from
# the checkout root.
pythonpath = ["."]
markers = [
    "corpus: needs the Blue Core corpus and bluecore-models; deselect with -m 'not corpus'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bibframe_json"]

# The schemas and the context are the artifacts this package exists to publish,
# so they live inside bibframe_json/ and hatchling ships them with the package.
# They used to sit at the top level, where `packages` excluded them and an
# installed copy had neither -- and no force-include is needed now they are in.

[tool.ruff]
# Leave Markdown alone. `ruff format` reformats Python code blocks inside it,
# which flattens the aligned comments the README's examples rely on to line the
# results up against the calls.
extend-exclude = ["*.md"]
