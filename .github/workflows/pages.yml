# The documentation site. Astro builds it, and src/integrations/artifacts.mjs
# copies the context, the schemas and the conformance corpus in at the paths
# their own $ids name -- which is what makes those $ids resolvable and
# {"$ref": "Ref.json"} work over the network. tests/test_artifacts.py checks
# that mapping, so a broken one fails the Test workflow rather than shipping.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# The defaults for a Pages deployment: read the repository, write the site, and
# mint the token deploy-pages exchanges for one.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and the newest wins: a queued build of an older
# commit would publish a site the repository has moved past.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Pages has to be turned on in Settings, by someone with admin on the
      # repository, with the source set to GitHub Actions. Until then this job
      # fails, which is the honest signal. There is no way around it from
      # here: configure-pages can create the site through the API with
      # `enablement: true`, and this org refuses it --
      #
      #   Create Pages site failed.
      #   Error: Resource not accessible by integration
      #
      # so the flag is left off rather than left in place not working.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
