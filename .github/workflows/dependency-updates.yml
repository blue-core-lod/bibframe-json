name: Weekly Dependency Updates

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch: # Enables the "Run workflow" button in GitHub

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest supported version, which is the one most likely to catch
        # an incompatibility. The pull request this opens runs the full matrix.
        python-version: [3.12]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Update dependencies
        run: uv lock --upgrade

      - name: Check for dependency changes
        id: check_changes
        run: |
          if git diff --quiet uv.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_changes.outputs.changed == 'true'
        run: uv sync

      # The same checks CI runs, in the same order. A dependency bump can break
      # formatting or typing as easily as it breaks a test -- ruff and ty are
      # themselves dependencies here.
      - name: Format
        if: steps.check_changes.outputs.changed == 'true'
        run: uv run ruff format --diff

      - name: Lint
        if: steps.check_changes.outputs.changed == 'true'
        run: uv run ruff check

      - name: Types
        if: steps.check_changes.outputs.changed == 'true'
        run: uv run ty check

      - name: Run tests
        if: steps.check_changes.outputs.changed == 'true'
        run: uv run pytest

      # Worth running on a dependency bump specifically, not just on a source
      # change. The artifacts are whatever rdflib emits, so an upgrade
      # to either can alter them without a line of this repo changing -- which
      # is exactly the drift nobody would otherwise notice.
      - name: Generated artifacts match their generators
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          uv run python generate/from_ontology.py
          uv run python generate/bundle.py
          git diff --exit-code bibframe_json/v0.1/context bibframe_json/v0.1/schema

      # No version bump. uv.lock is not in the wheel and the runtime
      # dependencies are open ranges, so a lock-only change would release the
      # same package under a new number. A dependency that forces a real change
      # gets one deliberately, and a release with it.
      - name: Date
        id: date
        if: steps.check_changes.outputs.changed == 'true'
        run: echo "today=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: create_pr
        if: steps.check_changes.outputs.changed == 'true' && success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: dependency-updates
          base: main
          title: 'Weekly dependency updates (${{ steps.date.outputs.today }})'
          body: |
            Weekly automated dependency updates.

            - Updated `uv.lock` via `uv lock --upgrade`

            The lock file is not part of the published package, so this does
            not bump the version or call for a release.

            Note this updates the Python dependencies only. The vendored
            BIBFRAME ontology tracks upstream separately -- replace
            `generate/bibframe.rdf` and regenerate to pick up a new release.
          commit-message: 'Update dependencies'
          labels: dependencies

      # Skipped rather than failed when no webhook is configured.
      - name: Notify Slack
        if: steps.check_changes.outputs.changed == 'true' && success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No SLACK_WEBHOOK_URL configured, skipping."
            exit 0
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"$REPO_NAME dependency update PR opened: <$PR_URL|view PR>\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on failure
        if: steps.check_changes.outputs.changed == 'true' && failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO_NAME: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No SLACK_WEBHOOK_URL configured, skipping."
            exit 0
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"$REPO_NAME dependency update failed: <$RUN_URL|view run>\"}" \
            "$SLACK_WEBHOOK_URL"
