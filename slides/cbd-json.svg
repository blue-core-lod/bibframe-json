<text class="j" x="132" y="406"><tspan fill="#15202b" font-weight="600">"title"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#93a0ab">{</tspan> <tspan fill="#15202b" font-weight="600">"@type"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#3d4b57" font-weight="400">"Title"</tspan><tspan fill="#93a0ab">]</tspan><tspan fill="#93a0ab">,</tspan> <tspan fill="#15202b" font-weight="600">"mainTitle"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#3d4b57" font-weight="400">"The Conceptual Structure of Reality"</tspan><tspan fill="#93a0ab">]</tspan> <tspan fill="#93a0ab">}</tspan><tspan fill="#93a0ab">]</tspan><tspan fill="#93a0ab">,</tspan></text>
<text class="j" x="132" y="445"><tspan fill="#15202b" font-weight="600">"identifiedBy"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#93a0ab">{</tspan> <tspan fill="#15202b" font-weight="600">"@type"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#3d4b57" font-weight="400">"Isbn"</tspan><tspan fill="#93a0ab">]</tspan><tspan fill="#93a0ab">,</tspan> <tspan fill="#15202b" font-weight="600">"rdf:value"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#3d4b57" font-weight="400">"9783319071862"</tspan><tspan fill="#93a0ab">]</tspan> <tspan fill="#93a0ab">}</tspan><tspan fill="#93a0ab">]</tspan><tspan fill="#93a0ab">,</tspan></text>
<text class="j" x="132" y="484"><tspan fill="#15202b" font-weight="600">"instanceOf"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan></text>
<text class="j" x="162" y="523"><tspan fill="#93a0ab">{</tspan></text>
<text class="j" x="192" y="562"><tspan fill="#15202b" font-weight="600">"@id"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#3d4b57" font-weight="400">"https://bibframe.example/works/4be57b41-…"</tspan><tspan fill="#93a0ab">,</tspan></text>
<text class="j" x="192" y="601"><tspan fill="#15202b" font-weight="600">"@type"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#3d4b57" font-weight="400">"Work"</tspan><tspan fill="#93a0ab">]</tspan><tspan fill="#93a0ab">,</tspan></text>
<text class="j" x="192" y="640"><tspan fill="#15202b" font-weight="600">"title"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#93a0ab">{</tspan> <tspan fill="#15202b" font-weight="600">"@type"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#3d4b57" font-weight="400">"Title"</tspan><tspan fill="#93a0ab">]</tspan><tspan fill="#93a0ab">,</tspan> <tspan fill="#15202b" font-weight="600">"mainTitle"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#3d4b57" font-weight="400">"The Conceptual Structure of Reality"</tspan><tspan fill="#93a0ab">]</tspan> <tspan fill="#93a0ab">}</tspan><tspan fill="#93a0ab">]</tspan><tspan fill="#93a0ab">,</tspan></text>
<text class="j" x="192" y="679"><tspan fill="#15202b" font-weight="600">"hasInstance"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#93a0ab">[</tspan><tspan fill="#3d4b57" font-weight="400">"https://bibframe.example/instances/0b46c016-…"</tspan><tspan fill="#93a0ab">]</tspan></text>
<text class="j" x="162" y="718"><tspan fill="#93a0ab">}</tspan></text>
<text class="j" x="132" y="757"><tspan fill="#93a0ab">]</tspan></text>
<text class="j" x="102" y="796"><tspan fill="#93a0ab">}</tspan></text>
<rect x="72" y="877" width="34" height="3" rx="1.5" fill="#2f7d7a"/>
<text class="nh" x="72" y="917">The document is the Instance</text>
<text class="ns" x="72" y="947">You asked for one, and that is what you get.</text>
<rect x="677" y="877" width="34" height="3" rx="1.5" fill="#b0743c"/>
<text class="nh" x="677" y="917">instanceOf embeds the Work</text>
<text class="ns" x="677" y="947">A stored record names it instead: there, the Work is</text>
<text class="ns" x="677" y="973">a row of its own.</text>
<rect x="1282" y="877" width="34" height="3" rx="1.5" fill="#6c7b87"/>
<text class="nh" x="1282" y="917">hasInstance points back by URI</text>
<text class="ns" x="1282" y="947">A processor breaks the cycle there, which keeps the</text>
<text class="ns" x="1282" y="973">document finite.</text>

<text class="foot" x="72" y="1026">Abridged from example/cbd.json, which validates against schema/cbd.json. Every property is an array, so a reader loops without checking.</text>
