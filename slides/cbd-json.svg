<text class="h1" x="72" y="92">One document explains the Instance</text>
<text class="sub" x="72" y="138">A Concise Bounded Description in bibframe-json: the Instance at the root, with its Work embedded.</text>
<line x1="72" y1="168" x2="1848" y2="168" stroke="#dde3e8" stroke-width="1"/>

<rect x="72" y="198" width="1776" height="643" rx="10"
      fill="#fcfdfd" stroke="#dde3e8" stroke-width="1"/>
