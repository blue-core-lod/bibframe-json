      fill="#fbf2e7" stroke="#b0743c" stroke-width="1.5"/>
<text class="tag" x="102" y="228" fill="#2f7d7a">INSTANCE</text>
<text class="tag" x="1818" y="521" fill="#b0743c" text-anchor="end">WORK</text>
<text class="j" x="102" y="250"><tspan fill="#93a0ab">{</tspan></text>
<text class="j" x="132" y="289"><tspan fill="#15202b" font-weight="600">"@context"</tspan><tspan fill="#93a0ab">:</tspan> <tspan fill="#3d4b57" font-weight="400">"…/bibframe-json/context/bibframe.jsonld"</tspan><tspan fill="#93a0ab">,</tspan></text>
