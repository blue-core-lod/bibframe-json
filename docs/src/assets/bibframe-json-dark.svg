<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A record between braces: three lines of description, the middle one in
       the delimiter color. Each line is shorter than the one above, which is
       what a catalog entry does as it runs out of things to say, and it leaves
       the stack with a faint resemblance to an F. That is a coincidence worth
       keeping and not a claim.

